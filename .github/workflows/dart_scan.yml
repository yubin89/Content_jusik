name: dart_scan

# 매일 19:13 KST (= 10:13 UTC) 자동 실행 + 수동 실행(Run workflow) 가능
# 저녁으로 옮긴 이유: ① 장 마감 후 저녁까지 올라오는 DART 공시를 더 많이 확보
#   ② 정각/반시각은 전 세계 cron이 몰려 GitHub가 수십분~수시간 지연 → 비혼잡 분(:13) 사용
on:
  schedule:
    - cron: "13 10 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DART disclosure scan
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_B: ${{ secrets.NOTION_DB_B }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.dart_scan
