name: dart_scan

# 매일 16:05 KST (= 07:05 UTC) 자동 실행 + 수동 실행(Run workflow) 가능
# 16:05 KST: 한국장 마감(15:30) 직후 이른 시각으로, 당일 장 중 DART 공시 대부분 확보.
# GitHub Actions 무료 cron은 best-effort(2~5시간 지연 가능) → 비혼잡 분(:05) 사용으로 완화.
on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DART disclosure scan
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_B: ${{ secrets.NOTION_DB_B }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.dart_scan
