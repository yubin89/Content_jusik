name: pykrx_scan

# 매일 16:30 KST (= 07:30 UTC) 자동 실행 + 수동 실행(Run workflow) 가능
# DART(16:05) 직후, 한국장 마감(15:30) 후 KRX 수급 데이터가 발행되는 시각.
# GitHub Actions 무료 cron은 best-effort(2~5시간 지연 가능) → 비혼잡 분(:30) 사용.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 선취매 스냅샷(data/pykrx_picks)을 레포에 커밋하기 위함
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pykrx supply-demand scan
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_C: ${{ secrets.NOTION_DB_C }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.pykrx_scan

      - name: Commit pick snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pykrx_picks
          if ! git diff --cached --quiet; then
            git commit -m "chore: 선취매 스냅샷/성과 $(date -u +%Y%m%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "변경된 스냅샷 없음 — 커밋 생략"
          fi
