name: pykrx_scan

# 매일 19:43 KST (= 10:43 UTC) 자동 실행 + 수동 실행(Run workflow) 가능
# DART(19:13) 직후로 저녁에 배치. 비혼잡 분(:43)으로 GitHub cron 지연 확률을 낮춤.
on:
  schedule:
    - cron: "43 10 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pykrx supply-demand scan
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_C: ${{ secrets.NOTION_DB_C }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.pykrx_scan
